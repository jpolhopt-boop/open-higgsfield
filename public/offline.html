<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b0c;
        color: #e8e8ea;
        font: 16px/1.5 system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: #e8e8ea;
        color: #0b0b0c;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>The studio needs a connection to generate. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
